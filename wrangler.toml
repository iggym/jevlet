name = "jevlet"
main = "worker/worker.js"
compatibility_date = "2026-01-01"

# Static UI (web/index.html) served for every non-/v1 path.
[assets]
directory = "./web"
binding = "ASSETS"

# Replace the IDs with the output of:
#   wrangler kv namespace create KV
#   wrangler d1 create jevlet
[[kv_namespaces]]
binding = "KV"
id = "8a70ac56dc92447fa7ce1561fb68facb"

[[d1_databases]]
binding = "DB"
database_name = "jevlet"
database_id = "60ce4d77-8a1f-4f6c-9872-bfe668179332"
migrations_dir = "migrations"

# Optional Workers AI fallback. Uncomment to enable.
# [ai]
# binding = "AI"

# Secrets (never commit): wrangler secret put GEMINI_API_KEY / GROQ_API_KEY / JEV_API_KEY
# Optional vars: GEMINI_MODEL, GROQ_MODEL, WORKERS_AI_MODEL, JEV_URL

# Billing (Stripe, test mode). Secrets: wrangler secret put STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET
# Vars (not secret): STRIPE_PRICE_PRO, STRIPE_PRICE_TEAM, optional APP_URL, SELF_SERVE_KEYS.
# Live keys (sk_live_) are refused unless STRIPE_LIVE_MODE = "true".
# Add these under [vars] below when enabling billing:
# STRIPE_PRICE_PRO = "price_..."
# STRIPE_PRICE_TEAM = "price_..."
# SELF_SERVE_KEYS = "true"

[vars]
# gemini-2.0-flash / 2.5-flash(-lite) were retired by Google (HTTP 404) as of 2026-10-11.
GEMINI_MODEL = "gemini-3.5-flash-lite"
# llama-3.1-8b-instant is no longer in Groq's model list (2026-10-11).
GROQ_MODEL = "openai/gpt-oss-20b"

